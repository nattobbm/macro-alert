# 叙事判断登记簿 · 外部博主/机构对同一事件的**事前**判断，到期和市场、和我们一起结算。
#
# 2026-09-12 建。起因：拆完艾丽 260 期（57.4 万字）发现她的框架解释力极强但几乎不结算——
# 判据给了不回收，涨跌双向兼容。Polymarket 生态 170 多个工具都只读市场，没有一个
# 把"叙事"拿去对着市场结算。我们做的就是这一格：**市场 / 我们 / 叙事，三方并排，到期记账。**
#
# 纪律：
#   - 只登记**带日期、带判据**的判断。"长期看涨"这种没有失效条件的不登。
#   - quote 必须是原话（来自字幕转写，可能有同音错字），不许润色。
#   - 登记后 judgment / quote / said_on 不得修改；结算只填 outcome / settled_at / settle_note。
#   - outcome：hit（说对）/ miss（说错）/ void（事件没发生或无法判定）/ null（未结算）。
#   - market_ref：对应哪个市场对手盘。没有就写 none，页面上诚实标"无市场对手盘"，不硬凑。

calls:
