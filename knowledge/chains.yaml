# 逻辑链定义（人话版，词汇对齐《全球宏观决策推理框架_零基础版》）
# 每个节点：label(人话) + term(原专业词,悬停显示) + 绑定指标自动判定
# status：crossed=破了 / near=快到了(距<5%) / quiet=安静 / fact=事实

chains:
  - id: debt_loop
    emoji: "💣"
    name: 政府债务和利息在互相推高
    term: 债务自我强化环
    name_en: "Debt & interest feeding each other"
    one_liner_en: "Too much debt -> gov suppresses yields to save interest -> breaks 70-yr norm, trust falls -> higher yields demanded -> more debt"
    falsify_en: "30Y holds below 5.10 = suppression worked, spiral paused"
    one_liner: 政府欠债太多 → 出手压利息省钱 → 但打破70年老规矩，大家更不信任 → 要求更高利息 → 欠得更多
    falsify: 30年利率稳稳待在5.10以下 = 这次压住了，雪球暂停
    falsify_rule: "us30y < 5.10"   # 单日判定，触发即标记待人工确认
    nodes:
      - {label_en: "Federal interest bill", label: "联邦政府利息支出", term: "净利息FY26前10月", value_text: "9630亿$(还在涨)", status: fact, note: "CBO官方账本"}
      - {label_en: "Total federal debt", label: "联邦债务总额", term: "公共债务", value_text: "40万亿$", status: fact, note: "2026-08-19突破"}
      - {label_en: "Treasury buybacks doubled", label: "财政部回购旧债(规模翻倍)", term: "财政部回购翻倍", value_text: "9/9开始", status: fact, note: "打破'规律且可预测'老传统"}
      - {label_en: "30Y back to prior high?", label: "30年利率回到高点?", term: "us30y vs 前高5.33", metric: us30y, threshold: 5.33, direction: above, note: "回去=压制失败"}
      - {label_en: "30Y danger zone", label: "30年利率失控区", term: "us30y vs 5.5", metric: us30y, threshold: 5.5, direction: above, note: "到这里政府必须出大招"}
      - {label_en: "Anyone still buying bonds?", label: "国债还有人买吗", term: "长债拍卖认购倍数", metric: long_btc, threshold: 2.2, direction: below, note: "低于2.2=买家不足"}

  - id: liquidity
    emoji: "💧"
    name: 市场备用资金快用完了
    term: 货币链（净流动性）
    name_en: "Market's spare cash running out"
    one_liner_en: "Backup pool (RRP) nearly empty -> further draining hits bank reserves -> overnight rate popping = earliest scarcity signal"
    falsify_en: "Treasury injects + Fed keeps buying = water level restored, alarm off"
    one_liner: 市场的备用水池已经空了 → 再抽水就直接抽银行的家底 → 隔夜借钱利率冒头=最早的缺水信号
    falsify: 财政部往外放水+央行续买 = 水位回升，警报解除
    nodes:
      - {label_en: "Reverse repo balance (backup pool)", label: "隔夜逆回购余额(市场备用资金)", term: "隔夜逆回购RRP余额", metric: rrp, threshold: 50, direction: below, note: "从2.55万亿抽干到快见底"}
      - {label_en: "Overnight rate vs Fed floor", label: "银行间隔夜利率 vs 央行下限", term: "SOFR vs IORB", metric: sofr, threshold: 3.68, direction: above, note: "持续冒头=银行缺现金"}
      - {label_en: "Anyone using the SRF backstop?", label: "常备回购工具SRF有人用吗", term: "SRF常备回购用量", metric: repo_ops, threshold: 1, direction: above, note: "有人用=真缺钱实锤"}
      - {label_en: "Treasury cash account TGA", label: "财政部现金账户TGA", term: "TGA余额", metric: tga_daily, threshold: 500000, direction: below, note: "大幅下降=在往市场放水"}

  - id: repression
    emoji: "🪙"
    name: 通胀偏高，但市场不信央行会加息
    term: 金融抑制链
    name_en: "Inflation high, but market doubts Fed will hike"
    one_liner_en: "Inflation expectations up + long yields up + market doubts hikes = savers quietly pay down gov debt -> gold benefits"
    falsify_en: "Real yield jumps AND gold falls with it = script changed, back to normal tightening"
    one_liner: 物价预期在涨 + 长期利率在涨 + 但市场不信央行会加息管 = 存钱的人悄悄亏钱替政府还债 → 黄金是这个剧本的受益者
    falsify: 真利率跳升而黄金跟着跌 = 剧本换了，回到正常紧缩
    nodes:
      - {label_en: "Does market believe Fed will act?", label: "市场信央行会管吗", term: "9月加息概率<0.4", metric: fedwatch_sep_hike, threshold: 0.4, direction: below, note: "低=不信"}
      - {label_en: "Long yields elevated", label: "长期利率在高位", term: "us30y>5.2", metric: us30y, threshold: 5.2, direction: above}
      - {label_en: "Inflation expectations rising", label: "大家觉得物价要涨", term: "10年盈亏平衡通胀>2.8", metric: breakeven10, threshold: 2.8, direction: above, note: "债市定价的通胀预期"}
      - {label_en: "Real yield (ex-inflation)", label: "真利率(扣掉通胀)", term: "10年TIPS实际利率", metric: tips10y, threshold: 2.6, direction: above, note: "黄金的定价锚：真利率低→金贵"}
      - {label_en: "Gold testing key level", label: "黄金冲关键位", term: "gold vs 4700", metric: gold, threshold: 4700, direction: above, note: "冲破=剧本被市场确认"}

  - id: geo
    emoji: "🛢️"
    name: 石油通道不稳 → 油价牵动物价和利率
    term: 地缘链
    name_en: "Oil route unstable -> prices, inflation, rates"
    one_liner_en: "Strait open or not -> oil -> prices -> Fed -> real yield -> gold (safe-haven and rate channels pull gold opposite ways)"
    falsify_en: "Deal lands + Brent stable under 80 = this domino laid down"
    one_liner: 海峡通不通 → 油价 → 物价 → 央行加不加息 → 真利率 → 黄金（注意：避险和利率两条路对黄金方向相反）
    falsify: 协议落地+油价稳在80以下 = 这张多米诺暂时放倒
    nodes:
      - {label_en: "Strait of Hormuz", label: "霍尔木兹海峡", term: "航运通行量", value_text: "还没恢复(约为战前8成)", status: fact}
      - {label_en: "Oil above band?", label: "油价出上界?", term: "Brent vs 90", metric: brent, threshold: 90, direction: above, note: "超90→物价压力回来"}
      - {label_en: "Oil below band?", label: "油价出下界?", term: "Brent vs 80", metric: brent, threshold: 80, direction: below, note: "低于80→美方行动更大胆(假说,样本少)"}
      - {label_en: "Oil daily spike", label: "油价单日暴涨", term: "brent单日>5%", metric: brent_1d_pct, threshold: 5, direction: above, note: "=供给出事了"}

  - id: japan
    emoji: "🎌"
    name: 日本若加息，借日元的全球资金要回流
    term: 日本链（尾部通道）
    name_en: "If Japan hikes, yen-funded money flows home"
    one_liner_en: "BOJ hikes -> yen strengthens -> ~$500bn yen-carry unwinds -> sell USTs & stocks -> global deleveraging"
    falsify_en: "Japan hikes yet adds USTs two months straight = chain broken"
    one_liner: 日本若加息 → 日元变强 → 全球借日元炒美股的钱(约5000亿$)要撤 → 卖美债卖股票 → 全球一起去杠杆
    falsify: 日本加息后反而连续两月增持美债 = 这条链断了
    nodes:
      - {label_en: "Japan's own interest bill", label: "日本自己的利息账单", term: "FY27偿债预算", value_text: "36.6万亿¥(+17%)", status: fact, note: "它也欠很多,加息也心疼"}
      - {label_en: "Is Japan selling USTs?", label: "日本在卖美债吗", term: "TIC日本持仓月变化", metric: tic_japan_chg, threshold: 0, direction: below, note: "连续在卖"}
      - {label_en: "Yen strong enough to unwind carry?", label: "日元强到撤资线?", term: "USDJPY vs 157", metric: usdjpy, threshold: 157, direction: below, note: "跌破157=撤资开始"}
      - {label_en: "Yen weak enough for intervention?", label: "日元弱到干预线?", term: "USDJPY vs 163", metric: usdjpy, threshold: 163, direction: above, note: "7/31官方出手过的位置"}

  - id: ai_credit
    emoji: "🤖"
    name: AI大厂靠借债扩张，借钱在变难
    term: AI融资链
    name_en: "AI giants expanding on debt; borrowing getting harder"
    one_liner_en: "$969bn off-balance leases -> funded by bonds & private credit -> demand weakening -> watch Oracle first -> stress hits chips & index"
    falsify_en: "New issues oversubscribed + Oracle CDS back under 150 = funding smooth, chain deprioritized"
    one_liner: 大厂账本外还藏着9690亿$的机房租约 → 靠发债和私募借新钱 → 借钱越来越难 → 谁先出事看Oracle → 出事则芯片和大盘一起抖
    falsify: 发债重新被抢购+Oracle保险费降回150以下 = 借钱顺畅，本链降权
    nodes:
      - {label_en: "Off-book commitments", label: "藏在账本外的承诺", term: "表外数据中心租约", value_text: "9690亿$(五巨头)", status: fact, note: "Moody's统计"}
      - {label_en: "Oracle default insurance (CDS)", label: "Oracle的违约保险费", term: "Oracle 5Y CDS", value_text: "约200bp(涨了4倍)", status: manual, note: "过250=危险,人工跟踪"}
      - {label_en: "Would banks get dragged in?", label: "银行会被拖下水吗", term: "银行敞口", value_text: "直接借的少,承诺的多", status: fact, note: "芝加哥联储:已借≈0.8%资产,承诺≈25%核心资本"}
      - {label_en: "Index one-day plunge", label: "大盘单日大跌", term: "SPX单日<-2%", metric: spx_1d_pct, threshold: -2, direction: below, note: "出事时的第一反应口"}
