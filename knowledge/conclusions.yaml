# 结论库：每条=一个已判定或待判定的研究结论
# verdict: 已证实 / 已证伪 / 未决 / 假设(加样中) / 事实
# 呈现规则：结论一句话在前，证据折叠在后。样本<8只加样不下结论。
# 新结论来源：回测输出、预测结算、研究报告——由对话整理入库，git commit=时间戳

conclusions:
  - id: H2_oversold_bounce
    date: 2026-08-27
    verdict: 已证实
    claim: 快速超卖（≤10日内跌≥5%）后5日反弹幅度系统性高于普通日子
    claim_en: "Fast oversold (>=5% drop within 10d) -> next-5d bounce beats baseline by +0.84% (95%CI all>0). Verified."
    number: "中位差+0.84%，95%CI[+0.47%,+1.60%]全>0"
    evidence: SPX 2000-2026，block bootstrap B=5000块长≥h，基线剔除事件日+h日
    source: 周期分析/output/report.md
    so_what: 3月/7月体验被数据确认。超卖区反弹预期有支撑；仓位映射等Phase 4预注册

  - id: H3_compression_reversed
    date: 2026-08-27
    verdict: 已证伪
    claim: 「日线压缩后必有大行情」——实测方向相反
    claim_en: "'Daily compression -> big move' is FALSE: moves after compression are 0.65% SMALLER than vol-matched control."
    number: "压缩结束后|位移|比波动率匹配组低0.65%，95%CI[−1.55%,−0.11%]全<0"
    evidence: 对照组=同等低波动但无≥5日持续性的日子（K3修订后）
    source: 周期分析/output/report.md
    so_what: 日线级"憋久必大动"不成立。盘中级是独立问题（M11待测），预期需收敛

  - id: H1_newhigh_undecided
    date: 2026-08-27
    verdict: 未决
    claim: 创252日新高后10日收益与普通日子等价（±0.3%内）
    claim_en: "After 252-day highs, 10d returns neither punished nor proven equivalent (90%CI slightly beyond band). Undecided."
    number: "90%CI[−0.44%,+0.08%]，略超等价界下沿"
    evidence: TOST等价检验，预注册界±0.3%
    source: 周期分析/output/report.md
    so_what: 没有证据表明追新高会被惩罚，但等价性也未获证明——对"害怕新高"情绪：数据不支持恐惧

  - id: M1b_down_faster
    date: 2026-08-27
    verdict: 已证实
    claim: 「上涨磨、下跌快」成立但幅度温和
    claim_en: "'Down fast, up slow' holds but mildly: |down|/up median speed = 1.26x (200 legs, 2000-2026)."
    number: "|下跌|/上涨中位速度比=1.26×（非碾压级）"
    evidence: 200条周期腿(2000-2026)；下跌腿中位−8.5%/15日，上涨+11.0%/20日
    source: 周期分析/output/m1b_speed_asymmetry.md


  - id: tic_triple_decline
    date: 2026-08-17
    verdict: 事实
    claim: 三大海外持有人2026-06同时减持美债
    claim_en: "Japan/UK/China all cut US Treasury holdings in 2026-06 (-26.4/-8.7/-25.9 bn USD). Primary-source verified."
    number: "日本−26.4bn / 英国−8.7bn / 中国−25.9bn"
    evidence: TIC slt_table5一手解析，与官方修订值精确一致
    source: macro-alert规则T2b（已触发）
    review_date: 2026-10-16   # 8月TIC发布日，自动标记复核
    so_what: 官方买方退潮→与央行购金是同一笔钱的两端

  - id: integer_cluster_dead
    date: 2026-08-20
    verdict: 已证伪
    claim: 整数价位聚集效应（含80/20价位族的先验）
    claim_en: "Round-number clustering effect: z=+24.4 collapses to ~+1.0 after tick-grid correction. Falsified."
    number: "z=+24.4修正后≈+1.0"
    evidence: tick网格伪影；H5检验必须用同一修正
    source: 前阶段研究（登记册§4已证伪清单）

  - id: gex_pinning_sample
    date: 2026-08-27
    verdict: 假设(加样中)
    claim: 正GEX下价格被钉在墙位附近（pinning）
    claim_en: "Positive-GEX pinning: spot sat 0.009% from the wall (n=1, logging only; daily GEX archive accruing)."
    number: "8/27实测：现价7675.7贴call墙7675(距0.009%)，净GEX+50bn"
    evidence: n=1只登记不推断；每日GEX快照自动累积中(data/gex/)
    auto_n_dir: gex   # 加样器：自动统计data/gex/样本数
    source: fetchers/cboe_gex.py
    so_what: 样本≥8后可做正/负gamma日波动性质分层检验（M11 Phase 2变量）

  - id: warsh_hawkish_talk_delayed_action
    date: 2026-09-01
    verdict: 未决
    claim: Warsh在杰克逊霍尔"该说的狠话说到位，但短期未必动手"——表态偏鹰、行动暂缓
    claim_en: "Warsh talked hawkish at Jackson Hole but may not act soon: rhetoric tightening is the cheapest option before midterms. Undecided until Sep 16 FOMC."
    number: "市场不同意：ZQ隐含9月加息概率 8-27 36.9% → 8-28 60.0%(讲话当日+23.1pp) → 9-01 73.8%"
    evidence: >
      讲话可核实内容(federalreserve.gov 2026-08-28)：①2%目标不调整不松动
      ②短期政策利率仍是主要工具、未推新非常规工具 ③不给前瞻指引，看数据临时判断
      ④近期通胀回落不足以证明底层趋势好转、保留加息选项。
      "行动暂缓"部分是推断不是讲话内容——依据为中期选举(11-03)前加息的三个代价
      （打压美股、推高美元压日元、抬美债付息）与五大工作组报告未出。
    source: 艾丽 8-29/8-30 视频（外部观点，非本库测量）；讲话原文经 federalreserve.gov 核实
    falsify: >
      ①9-16 FOMC 实际加息25bp → 本条证伪（"行动暂缓"错），官僚信誉框架加分；
      ②9-16 维持且声明保留加息选项 → 本条支持（说狠话与不动手并存）；
      ③9-16 维持且措辞软化转鸽 → 本条部分支持但"偏鹰"部分减分；
      ④中期选举(11-03)前任一次会议加息 → "选举前推迟实质动作"的核心机制证伪。
    review_date: 2026-09-16
    linked_prediction: 2026-09-16_fomc_hike_scenario
    so_what: >
      这是全库最高信息量判别点：艾丽框架(选举前口头紧缩)vs 官僚信誉框架(为信誉真加息)
      的正面冲突。市场用真金白银押了后者(73.8%)。注意本条是**别人的判断**不是本库测量，
      记录它是为了让它可被证伪——不是因为它更可信。
