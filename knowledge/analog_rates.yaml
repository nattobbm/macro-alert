types:
  - name: 问题出在"钱的价格"上
    outcome: 多数不崩
    why: >-
      利率太高、发债太多、有人被迫卖——决策者有工具（改口、放慢、少发长债、回购、临时买债、回购便利），
      也有动机：利息开支、金融稳定、选票他们自己也扛不住。市场知道他们会出手，恐慌有个底。
      上表里 2004、2006、2013、2022 秋、2023 秋都是这一类：办法直接打在"怕加息更快 / 怕发太多 / 怕没人接"上。
    examples: 2013-09 不缩减购债；2022-09-28 英国央行临时买长债；2023-11-01 财政部少增发长债
  - name: 问题出在"还不起、没利润"上
    outcome: 会崩
    why: >-
      放水救得了流动性，救不回没有利润的公司、还不起的债。工具只能托住，挡不住。
      互联网泡沫（2000–02，纳指 −78%）和 2008 都是这一类。
    examples: 2000–02、2008
  - name: 工具和目的打架
    outcome: 跌得深、时间长，但不是一夜崩
    why: >-
      通胀太高的时候，联储不能放水去救市场，只能等通胀自己下来。2022 年春天就是：没有办法可用，
      标普从高点跌了约四分之一，拖了大半年。
    examples: 2022-04（之后 20 天标普 −8.4%，是表里唯一大跌的一段）

our_data:
  - text: 现在这个宏观组合（真利率上行 + 2 年期上行 + 联储加息期 + 市场平静），2006 年以来 30 段、375 天里，标普第二天跌超 2% 只有 1.6%——一天崩很少见。
    src: 回测线 140 号文
  - text: 同一组合下，20 天内跌超 5% 反而有 27.5%，比所有日子（21%）还多；这组里的大跌全是利率上行引起的。慢慢跌比一天崩常见。
    src: 回测线 140 号文
  - text: 黄金在同一组合下（2006 年以来 18 段、374 天），20 天内跌超 10% 一次都没有，最深 −7.3%。
    src: 回测线 137 号文
  - text: 2022 和 2026 两轮黄金下跌对照：结束的钥匙都是"通胀见顶 + 联储改口"；2022 年到这个阶段联储已加了 3 个百分点，2026 年 9-16 才第一次加。
    src: 回测线 132、133 号文
  - text: 这些都是"没发生过"，不是"不可能"：18–30 段、20 年的样本，突发冲击（银行危机、战争）会打破它。
    src: 回测线 137 号文 §边界

full_chain:
  title: 一条推完的链：2023 年 10 月（和 9-29 同一个样子）
  rows:
    - {step: 决策者和目的, text: "财政部：赤字大，要用最低成本借很多钱。联储：压通胀，但不能把金融体系弄断。债券买家：拿到足够补偿才肯买长债。"}
    - {step: 情绪, text: "买债的人怕三件事：发得太多（8-02 增发 + 8-01 降级）、通胀下不来、利率更高更久 → 要更多补偿。买股票的人怕折现率变高。"}
    - {step: 行为和订单, text: "卖长债、买短债；股票按更高的折现率往下重估。"}
    - {step: 波动, text: "债、股一起跌，美元涨——和 9-29 同一个样子。30 年从 8 月 4.4% 冲到 10-19 的 5.11%。"}
    - {step: 市场怎么接受, text: "价格一路找新的平衡点，直到有人回应最怕的那件事。"}
    - {step: 修复, text: "办法一条一条打在害怕的源头上：怕更高更久 → 10-19 鲍威尔说长债利率已经在替联储收紧；怕发太多 → 11-01 财政部少增发长债；数据自己转弱 → 11-03 非农 +15 万。"}
    - {step: 结果, text: "30 年六周掉约 60 个基点；标普之后 60 天 +13%。"}
    - {step: 留下了什么, text: "债一分没少，只是改成多发短债（短债占比从约 16.5% 升到约 22%），等通胀和利率下来。问题被推后——这就是她说的「延缓」；2026 年它又回来了。"}
  sources:
    - {label: "Powell 2023-10-19", url: "https://www.federalreserve.gov/newsevents/speech/powell20231019a.htm"}
    - {label: "财政部 2023-11-01", url: "https://home.treasury.gov/news/press-releases/jy1864"}
    - {label: "财政部 TBAC 2024Q1（短债占比）", url: "https://home.treasury.gov/system/files/221/TreasuryPresentationToTBACQ12024.pdf"}

dotcom:
  title: 互联网泡沫为什么伤得那么大
  points:
    - text: 问题是"没利润"那一类：很多公司没有盈利，估值全靠预期；当时纳指市盈率常见说法在 100 倍以上（口径不一，没找到一手精确数）。
      sources: [{label: "Nasdaq Composite（维基，非一手）", url: "https://en.wikipedia.org/wiki/Nasdaq_Composite"}]
    - text: 钱是借来的：欧洲 3G 牌照拍卖，英国 2000 年 4 月拍出 225 亿英镑，德国 8 月约 505 亿欧元，电信公司背上重债。
      sources: [{label: "CNN 2000-08-17", url: "https://money.cnn.com/2000/08/17/europe/german_umts/index.htm"}, {label: "Cramton 英国 3G 报告", url: "http://www.cramton.umd.edu/papers2000-2004/01nao-cramton-report-on-uk-3g-auction.pdf"}]
    - text: 联储在往上加：1999-06-30 从 4.75% 起加，2000-05-16 加到 6.5%。
      sources: [{label: "FOMC 1999-06-30", url: "https://www.federalreserve.gov/boarddocs/press/general/1999/19990630/default.htm"}, {label: "FOMC 2000-05-16", url: "https://www.federalreserve.gov/boarddocs/press/general/2000/20000516/"}]
    - text: 后面接连出事：2001 年 3–11 月衰退（NBER）；安然 2001-12-02 破产；世通 2002-07-21 破产；9·11。
      sources: [{label: "NBER 2003-10-21", url: "https://www.nber.org/news/business-cycle-dating-committee-announcement-october-21-2003"}, {label: "Brookings", url: "https://www.brookings.edu/articles/cooking-the-books-the-cost-to-the-economy/"}]
    - text: 不是"只有美国好"：泡沫是全球的，德国新市场上市公司市值平均跌了 96%，2003 年关闭。纳指 2000-03-10 到 2002-10-09 跌约 78%，标普约 49%。
      sources: [{label: "BioWorld（新市场关闭）", url: "https://www.bioworld.com/articles/392498-germany-s-neuer-markt-closing-amid-mounting-losses-scandals"}, {label: "2002 年股市下跌（维基）", url: "https://en.wikipedia.org/wiki/Stock_market_downturn_of_2002"}]
    - text: 修复留下了什么：联储 2003-06-25 降到 1%。泰勒 2007 年论文认为 2002–05 年利率偏离规则"may have been a cause of the boom and bust in housing"——修复把问题挪到了房地产，接上 2008。（减税这一环没找到出处，不写。）
      sources: [{label: "FOMC 2003-06-25", url: "https://www.federalreserve.gov/boarddocs/press/monetary/2003/20030625/default.htm"}, {label: "Taylor 2007 Jackson Hole", url: "https://web.stanford.edu/~johntayl/Housing%20and%20Monetary%20Policy--Taylor--Jackson%20Hole%202007.pdf"}]

now:
  title: 这一次：延缓了四年又回来了，手上有哪些办法
  why: >-
    2022 年的债市压力怎么解的：英国央行临时买长债（2022-09-28），2023 年起财政部把发债往短期挪（短债占比从约 16.5% 升到约 22%），
    2024-05 起财政部回购旧债。问题没消失——联邦债务 9-25 是 40.10 万亿美元——只是往短期挪、等通胀下来。
    2026 年又回来的原因：油价（霍尔木兹）把通胀推上去、日本退出低利率、科技巨头为 AI 大量发债（五家今年约 1,940 亿美元，2025 全年 1,080 亿）。
    下面只列"谁、能用什么、什么时候"，不预测选哪个。
  menu:
    - who: 财政部
      when: 11-04 公布下季度发债计划
      tool: 长短债结构（再往短期挪就是少发长债）；回购旧债——8-19 宣布长端每次上限翻到至少 40 亿美元，9-09 起到 11-04
      fear: 怕长债发太多、没人接
      left: 债还在，挪到短期，要一直滚
      sources: [{label: "财政部 2026-08-05 再融资声明", url: "https://home.treasury.gov/news/press-releases/sb0590"}, {label: "财政部 回购翻倍", url: "https://home.treasury.gov/news/press-releases/sb0607"}]
    - who: 联储（沃什）
      when: 10-28 议息（加息概率 62–68%）
      tool: 加不加、怎么说；外国央行回购便利（FIMA）——贝森特 8-03 公开要求扩大，每家每天上限 600 亿美元，扩大要 FOMC 投票，目前没扩
      fear: 怕加息没完没了；怕海外央行为了拿美元去卖美债
      left: 加息压了通胀，但利息开支更重
      sources: [{label: "CNBC 2026-08-03 Bessent FIMA", url: "https://www.cnbc.com/2026/08/03/bessent-fed-japan-yen-fima-repo-facility.html"}]
    - who: 日本（片山 / 日本央行）
      when: 日本央行 10-29–30；汇率随时
      tool: 9-18 已加到 1.25%；7-31 是 1998 年以来第一次日美联合干预；9-24 片山说联合干预的原则"仍然有效"，9-29 说和美方保持密切沟通。160 是彭博说的"政治红线"，不是官方触发点
      fear: 怕日元失控 → 日本机构卖美债
      left: 日本自己的利息账单变重
      sources: [{label: "US News 2026-09-24 片山", url: "https://money.usnews.com/investing/news/articles/2026-09-24/japans-katayama-says-principles-of-japan-us-fx-intervention-remain-in-place"}, {label: "Bloomberg 2026-09-29 片山", url: "https://www.bloomberg.com/news/articles/2026-09-29/japan-s-katayama-reiterates-weak-yen-concern-after-bessent-call"}]
    - who: 能源部
      when: 9-29 已宣布
      tool: 战略石油储备以借贷方式投放最多 4,000 万桶，是 IEA 联合行动里美国承诺 1.72 亿桶的最后一批；但 6 月那一轮企业只借走约 50 万桶
      fear: 怕油价把通胀再推上去
      left: 储备降到 1982 年以来最低（单一来源）
      sources: [{label: "Bloomberg 2026-09-29", url: "https://www.bloomberg.com/news/articles/2026-09-29/us-to-tap-more-oil-from-emergency-reserve-as-fuel-prices-surge"}, {label: "BOE Report 2026-09-29", url: "https://boereport.com/2026/09/29/us-to-release-40-million-barrels-of-crude-from-strategic-petroleum-reserve-energy-department-says/"}]
    - who: 新买家（稳定币）
      when: 等立法
      tool: 稳定币发行方买短债，替联储缩表接盘；但 CLARITY 法案 9-15 参议院程序性投票没过（50 对 49，差 60 票），今年基本没戏
      fear: 怕短债没人接
      left: 稳定币被挤兑时会被迫卖债
      sources: [{label: "CNBC 2026-09-15 CLARITY", url: "https://www.cnbc.com/2026/09/15/senate-cloture-vote-on-clarity-act-fails-dealing-regulatory-setback-to-crypto-industry.html"}]
    - who: 所有人
      when: 随时
      tool: 口头干预、前瞻指引（上表 2004、2006、2013 都是改口在起作用）
      fear: 怕"更高更久"
      left: 说了要兑现，不兑现下次不灵
  note: 伊朗与霍尔木兹：9-26 特朗普拒绝伊朗分阶段重开方案，伊朗等美方正式答复，间接谈判最早 9-28 经卡塔尔恢复。

alie:
  title: 艾丽怎么推这件事（对照她的 7 集 + 09-10 全量 260 集拆解）
  summary: >-
    她的核心判断是"不会让它真崩"：美元体系有修复机制（货币互换、FIMA、预期管理、稳定币接盘），
    所以恐慌有底。这和上面"钱的价格型多数不崩"是同一个方向。但按 09-10 的全量拆解，她的框架自己关掉了证伪，
    结论不能直接采信——她提供假设，我们提供判据。
  items:
    - 推得最全的一集是 8-17（日元）：日元贬 → 日本通胀 → 多发债 → 日债利率涨 → 对冲基金被追保证金 → 卖美债 → 美债利率涨 → AI 发债变贵。修复：日美联合干预、FIMA 提额、日本加息；留下：日本借钱成本、能源通胀会更频繁。
    - 11-23 说得最直白：科技公司靠借债、银行也被卷进来，所以"不敢轻易让它有大幅的下挫"。
    - 5-25 讲到"修复留下了什么"：2001–03 降到 1%，钱流进房地产，给 2008 埋雷——和上面互联网泡沫那条一致。
    - 她跳过最多的两环是"订单"和"市场怎么接受"；"2022 年的问题被推迟"这层她没讲过。
    - 她说过但经查不对或没核到的：科技巨头发债"截至 7 月超过 2,200 亿"（路透是约 1,940 亿）；英伟达"5,000 亿表外融资、25% 残值担保"（5,000 亿是它牵头动员的第三方资金，25% 没核到）；长债"6.5% 甚至 7%"（30 年期 9-28 是 5.56%）。
    - 全量拆解里的旧结论仍然成立：56 次下跌归因里只有 12 次说清了是谁在卖。

open:
