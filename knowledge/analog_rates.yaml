# 「要崩没崩」知识文件（2026-09-29 建）
# 来源：交接 `全球宏观形势推理/2026-09-29_交接_为什么没崩_推理链_给网站对话.md`（SPX 盘中会话写）
# 规矩（她 09-29）：做不了的先记下来，不许敷衍、骗人、捏造。每条「办法」都要有出处；找不到的写"未找到"，不删不编。
# 查证：四路并行（2004–2013 / 2018–2026 / 互联网泡沫 + 这次的办法菜单 / 艾丽 7 集 + 09-10 的 260 集旧拆解）。
# 相似日条件和统计：回测线 `第三次回测研究9.2_数据/脚本/macro_0929/analog_0929.py`；网站每天用 core/analog.py 按同一口径查。

title: 要崩没崩：30 年利率冲新高、股票黄金一起跌的日子
answer: >-
  1999 年以来这种日子有 23 天，之后 20 天标普多数是涨的，跌得深的比例和平常日子一样。
  没崩的那几次，都是有人出手打在了市场最怕的那件事上；真正跌深的 2022 年春天，是通胀太高、联储没法出手。
  问题出在"钱的价格"上，决策者有工具也有动机，所以多数不崩；问题出在"还不起、没利润"上，工具托不住，才会崩。

stats: >-
  条件（事先定）：30 年利率收在一年新高、当天 +4 个基点以上，同一天标普跌、黄金跌、美元涨。
  命中 23 天：之后 20 天标普中位 +1.8%，74% 收涨，20 天内跌超 5% 的占 17%。
  对照：所有日子 +1.2%、63%、18%；只要求 +4 个基点不要求新高的齐跌日 +0.8%、59%、22%。
  样本小、相邻几天重叠，只能说"多数没接着崩"，不是规律。

episodes_note: >-
  点开看每段：那天为什么跌、谁用了什么办法、打在哪种害怕上、出处。"纠正"= 交接里凭记忆写的说法经查不对，原样标出来。
  30 年利率用 yfinance ^TYX（每段最后一天），和 FRED 口径差 1–3 个基点。

