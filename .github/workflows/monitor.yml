name: macro-monitor

on:
  schedule:
    # 美东 09:00 盘前（UTC 13:00，夏令时）
    - cron: '0 13 * * 1-5'
    # 美东 16:30 收盘后（UTC 20:30），覆盖当日拍卖结果
    - cron: '30 20 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - name: Run monitor
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          EIA_API_KEY: ${{ secrets.EIA_API_KEY }}
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
        run: python monitor.py
      - name: Commit data
        run: |
          git config user.name  "macro-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data/
          git diff --staged --quiet || git commit -m "data: $(date -u +%FT%H:%M)"
          git push
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: site/package-lock.json
      - name: Build site (React)
        run: |
          cd site && npm ci && npm run build && cd ..
          mkdir -p _site
          cp -r site/dist/. _site/
          cp -r data _site/data
          cp -r knowledge _site/knowledge
          cp -r web _site/classic
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: monitor
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
