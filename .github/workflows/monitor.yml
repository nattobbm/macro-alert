name: macro-monitor

on:
  schedule:
    # 美东 09:00 盘前（UTC 13:00，夏令时）
    - cron: '0 13 * * 1-5'
    # 美东 16:30 收盘后（UTC 20:30），覆盖当日拍卖结果
    - cron: '30 20 * * 1-5'
    # 盘中轻量刷价（只跑 --quotes-only，约20分钟一次，UTC 13-21点=美东9-17点）
    # 注：GitHub 定时任务不精确，免费额度下常延迟5-20分钟，实际间隔约20-40分钟
    - cron: '20,50 13-20 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      # 盘中的 :20/:50 场次只刷行情价(约15秒)，不跑规则不推TG；其余为完整流水线
      - name: Decide mode
        id: mode
        run: |
          if [ "${{ github.event.schedule }}" = "20,50 13-20 * * 1-5" ]; then
            echo "flag=--quotes-only" >> $GITHUB_OUTPUT
          else
            echo "flag=" >> $GITHUB_OUTPUT
          fi
      - name: Run monitor
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          EIA_API_KEY: ${{ secrets.EIA_API_KEY }}
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          # 金十官方MCP。少了这行，Secret 加了也白加——fetchers/jin10.py 读的是
          # 环境变量，工作流不传就永远拿不到，油价会静默退回 yfinance 的坏K线口径
          JIN10_MCP_TOKEN: ${{ secrets.JIN10_MCP_TOKEN }}
        run: python monitor.py ${{ steps.mode.outputs.flag }}
      - name: Commit data
        run: |
          git config user.name  "macro-bot"
          git config user.email "bot@users.noreply.github.com"
          # 留痕：monitor.py 写的一行摘要（源健康/触发规则/延迟/日历条数/行情变化）
          MSG=$(cat data/_commit_msg.txt 2>/dev/null || echo "data: $(date -u +%FT%H:%M)")
          git add data/
          git diff --staged --quiet || git commit -m "$MSG"
          git push
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: site/package-lock.json
      - name: Build site (React)
        run: |
          cd site && npm ci && npm run build && cd ..
          mkdir -p _site
          cp -r site/dist/. _site/
          cp -r data _site/data
          cp -r knowledge _site/knowledge
          cp -r web _site/classic
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: monitor
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
